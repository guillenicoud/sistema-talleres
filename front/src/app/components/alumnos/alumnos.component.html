<div class="container">
  <div *ngIf="error" class="alert alert-danger" role="alert">{{ error }} <button type="button" class="btn btn-sm btn-outline-danger" (click)="cargar()" [disabled]="cargando || guardando">Actualizar lista</button></div>
  <p *ngIf="cargando" role="status">Cargando...</p>
  <p *ngIf="guardando" role="status">Guardando cambios...</p>
  <h2 class="mb-4 text-primary">👥 Alumnos</h2>

  <!-- Tarjeta del formulario -->
  <div class="card shadow-sm mb-4">
    <div class="card-header bg-light fw-bold">➕ Agregar nuevo alumno</div>
    <div class="card-body">
      <form class="row g-3" (ngSubmit)="agregarAlumno()">
        <div class="col-md-6">
          <label class="form-label">Nombre</label>
          <div class="input-group">
            <span class="input-group-text">👤</span>
            <input aria-label="Nombre"
              type="text"
              class="form-control"
              placeholder="Nombre"
              [(ngModel)]="nuevoAlumno.nombre"
              name="nombre"
              required
            />
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Apellido</label>
          <div class="input-group">
            <span class="input-group-text">👤</span>
            <input aria-label="Apellido"
              type="text"
              class="form-control"
              placeholder="Apellido"
              [(ngModel)]="nuevoAlumno.apellido"
              name="apellido"
              required
            />
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label">DNI</label>
          <div class="input-group">
            <span class="input-group-text">🪪</span>
            <input aria-label="DNI"
              type="text"
              class="form-control"
              placeholder="DNI"
              [(ngModel)]="nuevoAlumno.dni"
              name="dni" pattern="[0-9]{7,8}" inputmode="numeric"
            />
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Teléfono</label>
          <div class="input-group">
            <span class="input-group-text">📞</span>
            <input aria-label="Teléfono"
              type="text"
              class="form-control"
              placeholder="Teléfono"
              [(ngModel)]="nuevoAlumno.telefono"
              name="telefono"
            />
          </div>
        </div>
        <div class="col-12 text-end mt-3">
          <button [disabled]="guardando || cargando" type="submit" class="btn btn-primary px-4">✅ Agregar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Tabla de alumnos -->
  <div class="card shadow-sm">
    <div class="card-header bg-light fw-bold">📋 Lista de alumnos</div>
    <div class="card-body p-0">
      <div class="table-responsive"><table class="table table-hover table-bordered m-0">
        <thead class="table-primary text-center">
          <tr>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>DNI</th>
            <th>Teléfono</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody class="text-center"><tr *ngIf="!cargando && !error && alumnos.length === 0"><td colspan="5">No hay alumnos registrados.</td></tr>
          <tr *ngFor="let alumno of alumnos">
            <!-- Nombre -->
            <td *ngIf="editId !== alumno.id_alumno">{{ alumno.nombre }}</td>
            <td *ngIf="editId === alumno.id_alumno">
              <input aria-label="Nombre"
                class="form-control form-control-sm"
                [(ngModel)]="formData.nombre"
              />
            </td>

            <!-- Apellido -->
            <td *ngIf="editId !== alumno.id_alumno">{{ alumno.apellido }}</td>
            <td *ngIf="editId === alumno.id_alumno">
              <input aria-label="Apellido"
                class="form-control form-control-sm"
                [(ngModel)]="formData.apellido"
              />
            </td>

            <!-- DNI -->
            <td *ngIf="editId !== alumno.id_alumno">{{ alumno.dni }}</td>
            <td *ngIf="editId === alumno.id_alumno">
              <input aria-label="DNI"
                class="form-control form-control-sm"
                [(ngModel)]="formData.dni"
              />
            </td>

            <!-- Teléfono -->
            <td *ngIf="editId !== alumno.id_alumno">{{ alumno.telefono }}</td>
            <td *ngIf="editId === alumno.id_alumno">
              <input aria-label="Teléfono"
                class="form-control form-control-sm"
                [(ngModel)]="formData.telefono"
              />
            </td>

            <!-- Acciones -->
            <td>
              <!-- Si no está en edición -->
              <button aria-label="Editar" [disabled]="guardando || cargando"
                *ngIf="editId !== alumno.id_alumno"
                class="btn btn-sm btn-outline-primary me-1"
                (click)="startEdit(alumno)"
              >
                ✏️
              </button>

              <!-- Si está en edición -->
              <ng-container *ngIf="editId === alumno.id_alumno">
                <button aria-label="Guardar cambios" [disabled]="guardando || cargando"
                  class="btn btn-sm btn-success me-1"
                  (click)="saveEdit()"
                >
                  💾
                </button>
                <button aria-label="Cancelar edición" [disabled]="guardando || cargando"
                  class="btn btn-sm btn-secondary me-1"
                  (click)="cancelEdit()"
                >
                  ❌
                </button>
              </ng-container>

              <button aria-label="Eliminar alumno" [disabled]="guardando || cargando"
                class="btn btn-sm btn-outline-danger"
                (click)="deleteAlumno(alumno.id_alumno)"
              >
                🗑️
              </button>
            </td>
          </tr>
        </tbody>
      </table></div>
    </div>
  </div>
</div>
